# tmux - modelled on craftzdog (Takuya Matsuyama)'s setup:
# C-t prefix, tmux-pain-control, popups, powerline statusline.
# Adapted: Catppuccin Macchiato colours, emacs copy-mode, and the split/zoom
# keys from the old Ghostty ctrl+a leader (2/3 like Emacs C-x 2 / C-x 3).

# ── Terminal ───────────────────────────────────────────────────────────────
# xterm-256color, not tmux-256color: that terminfo is missing on stock macOS
set -g default-terminal "xterm-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
# Undercurl + coloured underlines (Emacs flymake/flyspell squiggles)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

set -sg escape-time 10          # Meta keys in Emacs/fish stay snappy
set -g focus-events on          # Emacs auto-revert, fish redraw
set -g history-limit 64096
set -g mouse on
set -s set-clipboard on         # copies go to the system clipboard via OSC 52

set -g base-index 1             # windows/panes count from 1, like the keyboard
setw -g pane-base-index 1
set -g renumber-windows on

set -g set-titles on            # title bar follows the active pane / ssh host
set -g set-titles-string "#T"

# Emacs keys in copy-mode and the command prompt (C-s search, C-SPC, M-w copy)
set -g mode-keys emacs
set -g status-keys emacs

# ── Prefix ─────────────────────────────────────────────────────────────────
# C-t like Takuya: C-a is beginning-of-line in fish and Emacs.
# C-t C-t still sends a literal C-t (transpose-chars).
unbind C-b
set -g prefix C-t
bind C-t send-prefix
set -g repeat-time 0            # no accidental repeats after a prefix key

# ── Key bindings ───────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open the pane's directory in Finder / the Linux file manager
if-shell "uname -s | grep -q Darwin" \
    "bind o run-shell 'open \"#{pane_current_path}\"'" \
    "bind o run-shell 'xdg-open \"#{pane_current_path}\" >/dev/null 2>&1'"

# From the old Ghostty leader: 3 = split right, 2 = split down (Emacs C-x 3/2)
bind 3 split-window -h -c "#{pane_current_path}"
bind 2 split-window -v -c "#{pane_current_path}"
bind f resize-pane -Z           # zoom (z works too)
bind e select-layout -E         # spread panes evenly
bind u copy-mode -u             # scroll up a page
bind X kill-pane -a             # kill every other pane (Takuya's prefix e)
bind c new-window -c "#{pane_current_path}"

# Move the current window left/right (no prefix)
bind -n C-S-Left swap-window -t -1 \; previous-window
bind -n C-S-Right swap-window -t +1 \; next-window

# Copy-mode: drag with the mouse or M-w copies; also accept vi-style y
bind -T copy-mode y send -X copy-selection-and-cancel

# ── Look'n feel ────────────────────────────────────────────────────────────
# Dim inactive panes (Takuya does this with window-style)
set -g window-style "fg=#8087a2,bg=default"
set -g window-active-style "fg=#cad3f5,bg=default"

source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

# ── Plugins (TPM: prefix I installs, prefix U updates) ─────────────────────
# pain-control: | - \ _ split, h j k l select, H J K L resize, < > move window
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
if-shell "test -x ~/.config/tmux/plugins/tpm/tpm" "run '~/.config/tmux/plugins/tpm/tpm'"
