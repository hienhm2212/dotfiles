# tmux - prefix C-z (Emacs-friendly: C-a/C-b/C-SPC stay with Emacs and fish)
# Reload: prefix r

# ── Prefix ─────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-z
bind C-z send-prefix            # C-z C-z sends C-z (suspend a fish job)

# ── Terminal ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
set -sg escape-time 10          # no lag on Meta (M-x) in terminal Emacs
set -g focus-events on          # Emacs/editors see focus in/out
set -g set-clipboard on         # copy reaches the system clipboard via OSC 52
set -g history-limit 50000

# ── Behaviour ──────────────────────────────────────────────────────────────
set -g mouse on
set -g mode-keys emacs          # copy mode: C-SPC mark, M-w copy, C-s search
set -g status-keys emacs
set -g base-index 1             # windows start at 1, matching the keyboard
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g display-time 2000

# ── Windows (was Ghostty tabs) ─────────────────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind -r L next-window
bind -r H previous-window
bind -r < swap-window -t -1 \; select-window -t -1
bind -r > swap-window -t +1 \; select-window -t +1

# ── Panes (was Ghostty splits) ─────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5
bind e select-layout -E         # spread panes evenly
# z (zoom), x (kill pane), o (next pane) are tmux defaults

# ── Misc ───────────────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Status bar (Catppuccin Mocha, matches fzf/bat/Ghostty) ─────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#a6adc8]%H:%M "
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[bg=#313244,fg=#cba6f7,bold] #I:#W#{?window_zoomed_flag, 🔍,} "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
