# vim: ft=tmux
# Takuya's powerline statusline, recoloured with Catppuccin Macchiato.
# Needs a Nerd Font for the   glyphs (BerkeleyMono Nerd Font in Ghostty).
#
#   base #24273a  mantle #1e2030  crust #181926  surface0 #363a4f
#   surface1 #494d64  overlay0 #6e738d  overlay1 #8087a2  text #cad3f5
#   blue #8aadf4  yellow #eed49f  red #ed8796

set -g mode-style "fg=#cad3f5,bg=#494d64"
set -g message-style "fg=#cad3f5,bg=#363a4f"
set -g message-command-style "fg=#cad3f5,bg=#363a4f"

set -g pane-border-style "fg=#363a4f"
set -g pane-active-border-style "fg=#8aadf4"
set -g display-panes-active-colour "#8aadf4"
set -g display-panes-colour "#6e738d"
setw -g clock-mode-colour "#8aadf4"

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "fg=#a5adcb,bg=#1e2030"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left-style NONE
set -g status-right-style NONE

# Session block turns red while the prefix is pressed
set -g status-left "#[fg=#181926,bg=#{?client_prefix,#ed8796,#8aadf4},bold] #S:#I.#P #[fg=#{?client_prefix,#ed8796,#8aadf4},bg=#363a4f,nobold]#[fg=#cad3f5,bg=#363a4f] #(whoami) #[fg=#363a4f,bg=#1e2030] "
set -g status-right "#[fg=#363a4f,bg=#1e2030]#[fg=#cad3f5,bg=#363a4f] %H:%M #[fg=#8aadf4,bg=#363a4f]#[fg=#181926,bg=#8aadf4,bold] #h "

setw -g window-status-separator ""
setw -g window-status-style "fg=#8087a2,bg=#1e2030"
setw -g window-status-activity-style "underscore,fg=#a5adcb,bg=#1e2030"
setw -g window-status-format " #I  #{b:pane_current_path}#{?window_zoomed_flag, (z),} "
setw -g window-status-current-format "#[fg=#1e2030,bg=#363a4f]#[fg=#eed49f,bg=#363a4f,bold] #I #[fg=#363a4f,bg=#eed49f]#[fg=#181926,bg=#eed49f] #{b:pane_current_path}#{?window_zoomed_flag, (z),} #[fg=#eed49f,bg=#1e2030,nobold]"
