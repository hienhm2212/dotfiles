# Popups - Takuya's lazygit/Claude popups, with Magit instead of lazygit.

# Magit for the pane's repo. C-x C-c closes the popup; the Emacs daemon
# (started on demand by -a '') keeps running, so the next one opens instantly.
bind g display-popup -d "#{pane_current_path}" -w 90% -h 90% -E \
    "emacsclient -t -a '' -e '(magit-status \"#{pane_current_path}\")'"

# yazi file manager in the pane's directory
bind F display-popup -d "#{pane_current_path}" -w 80% -h 80% -E yazi

# Claude Code in a background session per directory: the popup can be closed
# (prefix d inside it detaches) and reopened without losing the chat.
bind y run-shell '\
  SESSION="claude-$(printf %s "#{pane_current_path}" | cksum | cut -d" " -f1)"; \
  tmux has-session -t "$SESSION" 2>/dev/null || \
  tmux new-session -d -s "$SESSION" -c "#{pane_current_path}" "claude"; \
  tmux display-popup -w80% -h80% -E "tmux attach-session -t $SESSION"'
